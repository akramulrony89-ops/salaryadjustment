const $=id=>document.getElementById(id),bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),p2=n=>String(n).padStart(2,'0');

$('main').innerHTML=`<div class="card"><h2 style="margin:0 0 6px">${bn(m.i)}. ${m.n} <span class="chip" id="bc"></span></h2><span class="sm">ইনপুট ড্যাশবোর্ড থেকে দিন – এখানে নিজে থেকে হালনাগাদ হয়</span></div>
<div class="row" style="margin-bottom:8px"><label>অর্থবছর<select id="fy" onchange="fy=+this.value;renderPaper()">${fyo()}</select></label><button onclick="dlReg()">এই ঔষধের রেজিস্টার PDF</button><button class="p" onclick="dlAll()">সম্পূর্ণ রেজিস্টার PDF (সব ঔষধ, প্রতিটি আলাদা পাতা)</button></div><div class="paper" id="paper"></div>`;renderPaper()}

let mo='';const ks=[...d.r,...d.u].map(e=>e.d.slice(0,7)).sort(),f0=ks[0],l0=ks[ks.length-1];for(let i=0;i<12;i++){const k=(6+i)%12,y=fy+(6+i>11?1:0),[a,b]=mr(y,k);if(!f0||a.slice(0,7)<f0||a.slice(0,7)>l0){mo+='<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>';continue}const pr=bal(m,a),r=rg(m,'r',a,b),u=rg(m,'u',a,b),ym=a.slice(0,7),mu=sm(d.u,e=>e.mo&&e.d.slice(0,7)==ym),du=u-mu;mo+=`<tr><td>${MN[k]} ${bn(y)}</td><td class="tr">${bn(pr+r)} <span class="sm">(${bn(pr)}+${bn(r)})</span></td><td class="tr">${pf?bn(u):`<input type="number" min="0" step="any" value="${mu||''}" onchange="setMo('${ym}',this.value)">${du?` <span class="sm">+দৈনিক ${bn(du)}</span>`:''}`}</td><td class="tr">${bn(pr+r-u)}</td><td></td></tr>`}
return`<div class="rt">ঔষধ মওজুদ ও খরচ রেজিস্টার</div><div class="rn">ঔষধের নাম: <b>${m.n}</b> <span class="sm">${m.p=='-'?'':m.p} ${m.u=='-'?'':m.u}</span></div>
<div class="tc"><b>ঔষধ প্রাপ্তির বিবরণ</b></div><table><tr class="tc"><th>গ্রহণের তারিখ</th><th>উৎস ও স্মারক নং</th><th>পরিমাণ (প্যাকেটের বিবরণ সহ)</th><th>মেয়াদ উত্তীর্ণের তারিখ</th><th>মোট মূল্য</th><th>গ্রহণকারী কর্মকর্তার স্বাক্ষর</th></tr>

function addU(){const m=M(cur),d=$('ud').value,q=+$('uq').value;if(!d||!(q>0))return toast('তারিখ ও পরিমাণ দিন');if(q>bal(m,'9'))return toast('অবশিষ্টের চেয়ে বেশি খরচ লেখা যাবে না');g(m.id).u.push({d,q,n:$('un').value.trim()});$('uq').value='';$('un').value='';save(m.id);renderPaper();renderList();toast('খরচ যোগ হয়েছে')}
